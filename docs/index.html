<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DvojityWendy Poems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff3e0;
      --bg-card: #fffaf0;
      --text: #3d2b1a;
      --text-muted: #b56a1e;
      --accent: #ffb300;
      --border: #ffdca8;
      --shadow: 0 4px 20px rgba(230, 81, 0, 0.14);
      --header-bg: #e65100;
      --header-text: #fff3e0;
    }
    :root[data-theme="dark"] {
      --bg: #1a1006;
      --bg-card: #241708;
      --text: #ffe8c9;
      --text-muted: #e0a24e;
      --accent: #ffca28;
      --border: #3a2410;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --header-bg: #140b04;
      --header-text: #ffe8c9;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      transition: background-color 0.5s ease;
    }
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 19px;
      line-height: 1.6;
      transition: color 0.5s ease;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 2.5rem 1rem 2rem;
      text-align: center;
      position: relative;
      transition: background-color 0.5s ease, color 0.5s ease;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      object-fit: contain;
      padding: 6px;
      margin: 0 auto 1rem;
      display: block;
      transition: border-color 0.5s ease, transform 0.4s ease;
    }
    .avatar:hover { transform: scale(1.05) rotate(-2deg); }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.3rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      font-style: italic;
      color: var(--header-text);
      opacity: 0.75;
      font-size: 1.05rem;
    }

    .theme-toggle {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--header-text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }
    .theme-toggle:hover { transform: rotate(20deg); border-color: var(--header-text); }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: block; }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
    }

    .poem-list {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .poem-list.fading {
      opacity: 0;
      transform: translateY(12px);
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 3rem 0;
    }

    .poem {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem 2.2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      transition-delay: calc(var(--i, 0) * 90ms);
    }
    .poem.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .copyright {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: pre-line;
    }

    .poem h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: 1.7rem;
      margin: 0 0 1.2rem;
      color: var(--text);
      line-height: 1.25;
    }

    .poem-body {
      white-space: pre-wrap;
      font-size: 1.08rem;
      line-height: 1.7;
      color: var(--text);
    }
    .poem-body::first-letter {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.4em;
      line-height: 0.85;
      float: left;
      margin: 0.08em 0.12em -0.05em 0;
      color: var(--accent);
      font-weight: 700;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 2.5rem 0 1rem;
      font-family: 'Playfair Display', Georgia, serif;
    }
    .pagination button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .pagination button:hover {
      background: var(--accent);
      color: var(--bg-card);
      border-color: var(--accent);
    }
    .pagination button[hidden] { display: none; }
    .page-info {
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      main { padding: 1.5rem 0.8rem; }
      .poem { padding: 1.5rem 1.3rem; }
      .poem-body::first-letter { font-size: 3em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem, .poem-list, body, header, .theme-toggle, .pagination button {
        transition: none !important;
      }
      .poem { opacity: 1; transform: none; }
      #particles { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header>
    <img class="avatar" src="avatar.png" alt="DvojityWendy" onerror="this.style.display='none'">
    <h1>DvojityWendy Poems</h1>
    <p>A collection in verse</p>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>
  <main>
    <div class="poem-list" id="poem-list">
      <div class="loading">Loading poems&hellip;</div>
    </div>
    <div class="pagination">
      <button id="prev-btn" hidden>&larr; Previous</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn" hidden>Next &rarr;</button>
    </div>
  </main>

  <script>
    /* ---------- Theme ---------- */
    const THEME_KEY = 'poe-theme';
    const savedTheme = localStorage.getItem(THEME_KEY)
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(THEME_KEY, next);
    };

    /* ---------- Ambient particles ---------- */
    (function particles() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, dots;
      const COUNT = 22;

      function resize() {
        w = canvas.width = innerWidth * devicePixelRatio;
        h = canvas.height = innerHeight * devicePixelRatio;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      function init() {
        dots = Array.from({ length: COUNT }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: (Math.random() * 1.8 + 0.6) * devicePixelRatio,
          vy: -(Math.random() * 0.25 + 0.05) * devicePixelRatio,
          vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: Math.random() * 0.005 + 0.002,
          alpha: Math.random() * 0.4 + 0.15
        }));
      }
      function color() {
        return document.documentElement.getAttribute('data-theme') === 'dark'
          ? '255, 202, 40'
          : '255, 111, 0';
      }
      function tick() {
        ctx.clearRect(0, 0, w, h);
        const c = color();
        for (const d of dots) {
          d.sway += d.swaySpeed;
          d.x += d.vx + Math.sin(d.sway) * 0.2 * devicePixelRatio;
          d.y += d.vy;
          if (d.y < -10) { d.y = h + 10; d.x = Math.random() * w; }
          if (d.x < -10) d.x = w + 10;
          if (d.x > w + 10) d.x = -10;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${c}, ${d.alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      resize();
      init();
      tick();
      addEventListener('resize', () => { resize(); init(); });
    })();

    /* ---------- Poems ---------- */
    const POEMS_PER_PAGE = 8;
    const BATCH = 50;
    const poems = [];
    let currentPage = 1;

    const fadeObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          fadeObserver.unobserve(entry.target);
        }
      }
    }, { rootMargin: '0px 0px -8% 0px' });

    const CURRENT_YEAR = new Date().getFullYear();

    function parsePoem(text) {
      let copyright = '';
      const crMatch = text.match(/\/\*\*([\s\S]*?)\*\//);
      if (crMatch) {
        copyright = crMatch[1]
          .replace(/^\s*\*\s?/gm, '')
          .replace(/(\d{4})\s*-\s*\d{4}/, `$1-${CURRENT_YEAR}`)
          .trim();
        text = text.replace(crMatch[0], '');
      }
      const lines = text.split('\n');
      const titleIdx = lines.findIndex(l => l.trim().length > 0);
      let title = '', body = '';
      if (titleIdx !== -1) {
        title = lines[titleIdx].trim();
        body = lines.slice(titleIdx + 1).join('\n').trim();
      }
      return { copyright, title, body };
    }

    async function fetchPoem(n) {
      try {
        const res = await fetch(`${String(n).padStart(3, '0')}.md`);
        if (!res.ok) return null;
        return parsePoem(await res.text());
      } catch {
        return null;
      }
    }

    async function loadPoems() {
      let n = 1;
      while (true) {
        const batch = await Promise.all(
          Array.from({ length: BATCH }, (_, i) => fetchPoem(n + i))
        );
        const found = batch.filter(p => p !== null);
        if (found.length === 0) break;
        const prevLen = poems.length;
        poems.push(...found);
        // Re-render current page only if it could now have more visible poems
        const visibleEnd = currentPage * POEMS_PER_PAGE;
        if (prevLen < visibleEnd) renderPage(currentPage);
        else updatePagination();
        n += BATCH;
      }
      if (poems.length === 0) {
        document.getElementById('poem-list').innerHTML =
          '<div class="loading">No poems found.</div>';
      }
    }

    function renderPage(page) {
      const list = document.getElementById('poem-list');
      list.replaceChildren();
      const start = (page - 1) * POEMS_PER_PAGE;
      const end = Math.min(start + POEMS_PER_PAGE, poems.length);

      for (let i = start; i < end; i++) {
        const p = poems[i];
        const div = document.createElement('div');
        div.className = 'poem';
        div.style.setProperty('--i', i - start);

        if (p.copyright) {
          const cr = document.createElement('div');
          cr.className = 'copyright';
          cr.textContent = p.copyright;
          div.appendChild(cr);
        }

        const h2 = document.createElement('h2');
        h2.textContent = p.title;
        div.appendChild(h2);

        const body = document.createElement('div');
        body.className = 'poem-body';
        body.textContent = p.body;
        div.appendChild(body);

        list.appendChild(div);
        fadeObserver.observe(div);
      }
      updatePagination();
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(poems.length / POEMS_PER_PAGE));
      document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prev-btn').hidden = currentPage <= 1;
      document.getElementById('next-btn').hidden = currentPage >= totalPages;
    }

    function goToPage(newPage) {
      const totalPages = Math.ceil(poems.length / POEMS_PER_PAGE);
      if (newPage < 1 || newPage > totalPages || newPage === currentPage) return;
      const list = document.getElementById('poem-list');
      list.classList.add('fading');
      setTimeout(() => {
        currentPage = newPage;
        renderPage(currentPage);
        list.classList.remove('fading');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 280);
    }

    document.getElementById('prev-btn').onclick = () => goToPage(currentPage - 1);
    document.getElementById('next-btn').onclick = () => goToPage(currentPage + 1);

    loadPoems();
  </script>
</body>
</html>
