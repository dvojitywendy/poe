<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DvojityWendy Poems</title>
  <style>
    body { font-family: 'Georgia', serif; background: #f9f9f9; color: #222; margin: 0; padding: 0; }
    header { background: #222; color: #fff; padding: 1rem; text-align: center; }
    .poem-list { max-width: 800px; margin: 2rem auto; padding: 1rem; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .poem { margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
    .poem h2 { margin-top: 0; font-size: 1.3em; color: #444; }
    .copyright { font-size: 0.9em; color: #888; margin-bottom: 0.5em; white-space: pre-line; }
    @media (max-width: 600px) { .poem-list { padding: 0.5rem; } }
  </style>
</head>
<body>
  <header>
    <h1>DvojityWendy Poems</h1>
    <p>All poems from the repository</p>
  </header>
  <main>
    <div class="poem-list" id="poem-list">
      Loading poems...
    </div>
    <div style="text-align:center; margin:2rem 0;">
      <button id="prev-btn" style="margin-right:1em;display:none;">Previous</button>
      <span id="page-info"></span>
      <button id="next-btn" style="margin-left:1em;display:none;">Next</button>
    </div>
  </main>
  <script>
    const POEMS_PER_PAGE = 8;
    const BATCH = 50;
    const poems = [];
    let currentPage = 1;

    function parsePoem(text) {
      let copyright = '';
      const crMatch = text.match(/\/\*\*([\s\S]*?)\*\//);
      if (crMatch) {
        copyright = crMatch[1].replace(/^\s*\*\s?/gm, '').trim();
        text = text.replace(crMatch[0], '');
      }
      const lines = text.split('\n');
      const titleIdx = lines.findIndex(l => l.trim().length > 0);
      let title = '';
      let body = '';
      if (titleIdx !== -1) {
        title = lines[titleIdx].trim();
        body = lines.slice(titleIdx + 1).join('\n').trim();
      }
      return { copyright, title, body };
    }

    async function fetchPoem(n) {
      try {
        const res = await fetch(`${String(n).padStart(3, '0')}.md`);
        if (!res.ok) return null;
        return parsePoem(await res.text());
      } catch {
        return null;
      }
    }

    async function loadPoems() {
      let n = 1;
      while (true) {
        const batch = await Promise.all(
          Array.from({ length: BATCH }, (_, i) => fetchPoem(n + i))
        );
        const found = batch.filter(p => p !== null);
        if (found.length === 0) break;
        poems.push(...found);
        renderPage(currentPage);
        n += BATCH;
      }
      if (poems.length === 0) renderPage(currentPage);
    }

    function renderPage(page) {
      const list = document.getElementById('poem-list');
      list.replaceChildren();
      if (poems.length === 0) {
        list.textContent = 'No poems found.';
        updatePagination();
        return;
      }
      const start = (page - 1) * POEMS_PER_PAGE;
      const end = Math.min(start + POEMS_PER_PAGE, poems.length);
      for (let i = start; i < end; i++) {
        const p = poems[i];
        const div = document.createElement('div');
        div.className = 'poem';

        const cr = document.createElement('div');
        cr.className = 'copyright';
        cr.textContent = p.copyright;
        div.appendChild(cr);

        const h2 = document.createElement('h2');
        h2.textContent = p.title;
        div.appendChild(h2);

        const pre = document.createElement('pre');
        pre.textContent = p.body;
        div.appendChild(pre);

        list.appendChild(div);
      }
      updatePagination();
    }

    function updatePagination() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');
      const totalPages = Math.max(1, Math.ceil(poems.length / POEMS_PER_PAGE));
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.style.display = currentPage > 1 ? '' : 'none';
      nextBtn.style.display = currentPage < totalPages ? '' : 'none';
    }

    document.getElementById('prev-btn').onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
      }
    };
    document.getElementById('next-btn').onclick = () => {
      const totalPages = Math.ceil(poems.length / POEMS_PER_PAGE);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage(currentPage);
      }
    };

    loadPoems();
  </script>
</body>
</html>
